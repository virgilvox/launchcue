# ─── Cloud mode: Frontend + Express API only ───
# Supabase hosted externally (Supabase Cloud or separate instance)
# Usage: docker compose -f docker-compose.cloud.yml up -d

services:
  # ─── Frontend (Vue SPA via nginx) ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Express API Server ───
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@launchcue.dev}
    restart: unless-stopped
